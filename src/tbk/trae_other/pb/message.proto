syntax = "proto3";

package tbk.protocol;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

// 消息头部信息
message MessageHeader {
    string message_id = 1;              // 消息唯一ID
    string topic = 2;                   // 主题名称
    string namespace = 3;               // 命名空间
    string publisher_id = 4;            // 发布者ID
    google.protobuf.Timestamp timestamp = 5;  // 发送时间戳
    uint64 sequence_number = 6;         // 序列号
    string message_type = 7;            // 消息类型
    MessagePriority priority = 8;       // 消息优先级
    uint32 ttl_seconds = 9;            // 生存时间（秒）
}

// 消息优先级
enum MessagePriority {
    LOW = 0;
    NORMAL = 1;
    HIGH = 2;
    CRITICAL = 3;
}

// 消息元数据
message MessageMetadata {
    map<string, string> properties = 1;  // 自定义属性
    string correlation_id = 2;           // 关联ID
    string reply_to = 3;                 // 回复地址
    CompressionType compression = 4;      // 压缩类型
    EncryptionType encryption = 5;        // 加密类型
}

// 压缩类型
enum CompressionType {
    NONE = 0;
    GZIP = 1;
    LZ4 = 2;
    SNAPPY = 3;
}

// 加密类型
enum EncryptionType {
    PLAIN = 0;
    AES_256 = 1;
    RSA = 2;
}

// 完整消息结构
message Message {
    MessageHeader header = 1;
    google.protobuf.Any payload = 2;
    MessageMetadata metadata = 3;
    bytes checksum = 4;                  // 校验和
}

// 消息确认
message MessageAck {
    string message_id = 1;
    string subscriber_id = 2;
    AckStatus status = 3;
    string error_message = 4;
    google.protobuf.Timestamp ack_timestamp = 5;
}

enum AckStatus {
    SUCCESS = 0;
    FAILED = 1;
    RETRY = 2;
}

// 批量消息
message MessageBatch {
    repeated Message messages = 1;
    uint32 batch_size = 2;
    string batch_id = 3;
}