syntax = "proto3";

package tbk.protocol;

import "google/protobuf/timestamp.proto";

// 节点信息
message NodeInfo {
    string node_id = 1;
    string node_name = 2;
    string namespace = 3;
    string ip_address = 4;
    uint32 port = 5;
    NodeType node_type = 6;
    google.protobuf.Timestamp registration_time = 7;
    google.protobuf.Timestamp last_heartbeat = 8;
    map<string, string> metadata = 9;
    repeated string supported_protocols = 10;
    NodeCapabilities capabilities = 11;
}

enum NodeType {
    PUBLISHER = 0;
    SUBSCRIBER = 1;
    BROKER = 2;
    GATEWAY = 3;
}

// 节点能力
message NodeCapabilities {
    uint64 max_message_size = 1;
    uint32 max_connections = 2;
    repeated string supported_compressions = 3;
    repeated string supported_encryptions = 4;
    bool supports_batching = 5;
    bool supports_ordering = 6;
}

// 主题信息
message TopicInfo {
    string topic_name = 1;
    string namespace = 2;
    string message_type = 3;
    string schema_version = 4;
    TopicConfig config = 5;
    repeated string publishers = 6;
    repeated string subscribers = 7;
    google.protobuf.Timestamp created_time = 8;
}

// 主题配置
message TopicConfig {
    uint32 max_message_size = 1;
    uint32 retention_hours = 2;
    uint32 max_subscribers = 3;
    bool enable_ordering = 4;
    bool enable_persistence = 5;
    ReplicationConfig replication = 6;
}

// 复制配置
message ReplicationConfig {
    uint32 replication_factor = 1;
    ConsistencyLevel consistency_level = 2;
}

enum ConsistencyLevel {
    EVENTUAL = 0;
    STRONG = 1;
    BOUNDED_STALENESS = 2;
}

// 服务发现查询
message DiscoveryQuery {
    QueryType query_type = 1;
    string topic = 2;
    string namespace = 3;
    string message_type = 4;
    map<string, string> filters = 5;
    uint32 max_results = 6;
}

enum QueryType {
    FIND_PUBLISHERS = 0;
    FIND_SUBSCRIBERS = 1;
    FIND_TOPICS = 2;
    FIND_NODES = 3;
}

// 服务发现响应
message DiscoveryResponse {
    repeated NodeInfo nodes = 1;
    repeated TopicInfo topics = 2;
    uint32 total_count = 3;
    bool has_more = 4;
    string next_token = 5;
}