[build-system]
requires = [
    "scikit-build-core>=0.8.0",
    "pybind11>=2.10.0",
    "cmake>=3.15",
    "ninja"
]
build-backend = "scikit_build_core.build"

[project]
name = "tbk"
version = "0.3.0"
description = "Turing-zero Bot Kits - Unified C++/Python Framework"
authors = [{name = "Turing-zero Robotics", email = "turingzero.robot@gmail.com"}]
dependencies = [
    "pybind11>=2.10.0",
    "numpy>=1.20.0"
]

[tool.scikit-build]
cmake.build-type = "Release"
cmake.verbose = true
wheel.packages = ["src/python"]